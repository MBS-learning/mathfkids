<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBS Toán Học AI - Thế giới của 4 Siêu Nhí</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Chào mừng Clara, Cris, Simon & Toro đến với thế giới Toán học!</h1>
        <div id="main-progress-container" class="dashboard-overview">
            <p>Tiến độ chung của cả nhóm</p>
            <div class="progress-bar-bg"><div id="total-progress" class="progress-fill" style="width: 0%"></div></div>
        </div>
    </header>

    <main class="dashboard">
        <!-- Thẻ chọn nhân vật -->
        <div class="card" id="clara" onclick="initUser('clara')">
            <img src="images/clara_avatar.png" alt="Clara">
            <h3>Clara (2022)</h3>
            <p>Mầm non/Lớp 1</p>
        </div>
        <div class="card" id="cris" onclick="initUser('cris')">
            <img src="images/cris_avatar.png" alt="Cris">
            <h3>Cris (2018)</h3>
            <p>Lớp 3</p>
        </div>
        <div class="card" id="simon" onclick="initUser('simon')">
            <img src="images/simon_avatar.png" alt="Simon">
            <h3>Simon (2017)</h3>
            <p>Lớp 4</p>
        </div>
        <div class="card" id="toro" onclick="initUser('toro')">
            <img src="images/toro_avatar.png" alt="Toro">
            <h3>Toro (2016)</h3>
            <p>Lớp 5</p>
        </div>
    </main>

    <!-- Khu vực học tập -->
    <section id="learning-zone" class="content-box" style="display:none;">
        <div id="timer-area" class="timer-style">Thời gian còn lại: <span id="timer-display">--</span>s</div>
        <h2 id="welcome-msg"></h2>
        
        <div class="tabs">
            <button onclick="showSection('theory')">Lý thuyết hình ảnh</button>
            <button onclick="showSection('exercise')">Mini Game Bài tập</button>
            <button onclick="showSection('mistakes')">Ngân hàng lỗi sai</button>
        </div>

        <div id="theory" class="tab-content"></div>
        <div id="exercise" class="tab-content"></div>
        <div id="mistakes" class="tab-content"></div>
        
        <button class="back-btn" onclick="backToDashboard()">Quay lại Dashboard</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
